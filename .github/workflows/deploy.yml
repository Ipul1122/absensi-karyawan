name: Deploy to cPanel Rumahweb

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih target deploy:'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - frontend_only
          - backend_only

jobs:
  # ==============================================================
  # DETECT CHANGES: Cek folder mana yang mengalami perubahan
  # ==============================================================
  changes:
    name: 🔍 Deteksi Perubahan Folder
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔎 Cek Folder Frontend / Backend
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  # ==============================================================
  # JOB 1: BUILD & DEPLOY FRONTEND
  # Hanya jalan jika folder frontend berubah, atau dipilih manual
  # ==============================================================
  deploy_frontend:
    name: Build & Deploy Frontend (goodpeople-hcms.com)
    needs: changes
    if: |
      inputs.target == 'all' ||
      inputs.target == 'frontend_only' ||
      (inputs.target == 'auto' && needs.changes.outputs.frontend == 'true') ||
      (github.event_name == 'push' && (needs.changes.outputs.frontend == 'true' || (needs.changes.outputs.frontend == 'false' && needs.changes.outputs.backend == 'false')))
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🛠️ Build Frontend (Production Mode)
        working-directory: ./frontend
        env:
          VITE_API_URL: https://api.goodpeople-hcms.com
          VITE_APP_URL: https://goodpeople-hcms.com
        run: npm run build

      - name: 🚀 Sync Frontend to cPanel (goodpeople-hcms.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./frontend/dist/
          server-dir: public_html/goodpeople-hcms.com/
          dangerous-clean-slate: false

  # ==============================================================
  # JOB 2: DEPLOY BACKEND LARAVEL
  # Hanya jalan jika folder backend berubah, atau dipilih manual
  # ==============================================================
  deploy_backend:
    name: Sync Backend Laravel (api.goodpeople-hcms.com)
    needs: changes
    if: |
      inputs.target == 'all' ||
      inputs.target == 'backend_only' ||
      (inputs.target == 'auto' && needs.changes.outputs.backend == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Sync Backend Files to cPanel (api.goodpeople-hcms.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./backend/
          server-dir: public_html/api.goodpeople-hcms.com/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/storage/**
            storage/**
            **/.env
            .env
            **/node_modules/**
            node_modules/**
            **/vendor/**
            vendor/**
            tests/**
            **/tests/**
